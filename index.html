<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>

<style>
  body { margin:0; font-family:Arial,sans-serif; }
  header {
    background:#1f4fa3;
    color:white;
    padding:10px;
    display:flex;
    gap:10px;
    align-items:center;
    flex-wrap:wrap;
  }
  #map { height: calc(100vh - 80px); }

  select, input {
    padding:6px;
    font-size:14px;
  }

  input {
    width:220px;
  }

  .popup-img {
    width:100%;
    max-width:200px;
    margin-bottom:6px;
    border-radius:4px;
  }

  #count {
    margin-left:auto;
    font-weight:bold;
  }
</style>
</head>

  <input type="text" id="nameSearch" placeholder="Поиск по названию завода">
  <select id="typeFilter"><option value="all">Все типы</option></select>
  <select id="regionFilter"><option value="all">Все регионы</option></select>
  <span id="count"></span>
</header>

<div id="map"></div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

    link: "https://gkinterenergo.ru/"
  }
];

// Маркеры
let markers = L.layerGroup().addTo(map);

// Заполнение фильтров
const typeFilter = document.getElementById("typeFilter");
const regionFilter = document.getElementById("regionFilter");
const nameSearch = document.getElementById("nameSearch");
const countLabel = document.getElementById("count");

[...new Set(factories.map(f => f.type))].forEach(t =>
  typeFilter.add(new Option(t, t))
);

[...new Set(factories.map(f => f.region))].forEach(r =>
  regionFilter.add(new Option(r, r))
);

// Функция рендера
function render() {
  markers.clearLayers();
  let count = 0;
  let lastCoords = null;

  const searchText = nameSearch.value.toLowerCase();

  factories.forEach(f => {
    if (
      (typeFilter.value !== "all" && f.type !== typeFilter.value) ||
      (regionFilter.value !== "all" && f.region !== regionFilter.value) ||
      (searchText && !f.name.toLowerCase().includes(searchText))
    ) return;

    count++;
    lastCoords = f.coords;

    const img = f.image || "images/default.png";

    const linkHTML = f.link
      ? `<br><a href="${f.link}" target="_blank">Официальный сайт</a>`
      : "";

    const popup = `
      <img src="${img}" class="popup-img">
      <b>${f.name}</b><br>
      ${f.city}<br>
      <i>${f.type}</i><br>
      ${f.desc}
      ${linkHTML}
    `;

    L.marker(f.coords)
      .addTo(markers)
      .bindPopup(popup);
  });

  // Обновляем счётчик
  countLabel.textContent = `Найдено: ${count}`;

  // Центрирование на результате, если есть
  if (lastCoords && searchText) {
    map.setView(lastCoords, 8);
  }
}

// Подключение событий
typeFilter.onchange = render;
regionFilter.onchange = render;
nameSearch.oninput = render;

// Первый рендер
render();

</script>
